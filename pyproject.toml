[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiral-cosmic-conductor"
version = "0.2.0"
description = "Local-first shared-state multimodel reasoning orchestration research runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "SpiralReality"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools]
packages = ["conductor"]
