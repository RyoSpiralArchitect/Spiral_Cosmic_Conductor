name: Contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scripted integrated demo and receipt replay
        run: |
          python -m conductor cosmic-demo --out runs/ci
          python -m conductor audit runs/ci
          python -m conductor cosmic-demo --no-speculation --out runs/ci-guarded
      - name: Public text memory simulation and replay
        run: |
          python -I -S -B experiments/text_memory_pilot.py --out runs/text-simulation
          python -I -S -B experiments/text_memory_pilot.py --mode replay --replay runs/text-simulation --out runs/text-replay
      - name: Source comparison routing and replay
        run: |
          python -I -S -B experiments/source_alignment_pilot.py --out runs/source-check
          python -I -S -B experiments/source_alignment_pilot.py --mode replay --replay runs/source-check --out runs/source-check-replay
      - name: Shared route transmission comparison and replay
        run: |
          python -I -S -B experiments/transmission_comparison.py --out runs/transmission-check
          python -I -S -B experiments/transmission_comparison.py --mode replay --replay runs/transmission-check --out runs/transmission-check-replay
      - name: Emergence boundary probe and replay
        run: |
          python -I -S -B experiments/emergence_probe.py --out runs/emergence-check
          python -I -S -B experiments/emergence_probe.py --mode replay --replay runs/emergence-check --out runs/emergence-check-replay
