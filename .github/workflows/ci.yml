name: Contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scripted integrated demo and receipt replay
        run: |
          python -m conductor cosmic-demo --out runs/ci
          python -m conductor audit runs/ci
          python -m conductor cosmic-demo --no-speculation --out runs/ci-guarded
